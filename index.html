 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RKG EDITZ - Video Editor</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
  text-align:center;
}

.editor{
  max-width:700px;
  margin:30px auto;
  padding:20px;
}

h1{
  color:#00eaff;
}

.upload{
  border:2px dashed #00eaff;
  padding:25px;
  border-radius:15px;
  margin-bottom:20px;
}

input[type="file"]{
  width:100%;
  padding:12px;
}

video{
  width:100%;
  max-height:400px;
  margin-top:20px;
  border-radius:15px;
  background:#000;
}

.controls{
  margin-top:20px;
  display:grid;
  gap:12px;
}

button{
  padding:12px;
  border:0;
  border-radius:10px;
  background:#00eaff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  transform:scale(1.03);
}

label{
  text-align:left;
}

input[type="range"]{
  width:100%;
}
</style>
</head>

<body>

<div class="editor">

<h1>🎬 RKG EDITZ VIDEO EDITOR</h1>

<div class="upload">
  <p>📁 Select Your Video</p>
  <input type="file" id="videoInput" accept="video/*">
</div>

<video id="video" controls></video>

<div class="controls">

<label>
🌞 Brightness
<input type="range" id="brightness" min="50" max="200" value="100">
</label>

<label>
🎨 Contrast
<input type="range" id="contrast" min="50" max="200" value="100">
</label>

<label>
🌈 Saturation
<input type="range" id="saturation" min="0" max="200" value="100">
</label>

<label>
🎬 Video Speed
<input type="range" id="speed" min="0.25" max="2" step="0.25" value="1">
</label>

<button onclick="filterNormal()">Normal</button>
<button onclick="filterCinematic()">🎬 Cinematic</button>
<button onclick="filterBlack()">🖤 Black & White</button>
<button onclick="filterVivid()">🔥 Vivid</button>
<button onclick="rotateVideo()">🔄 Rotate</button>
<button onclick="resetEdit()">♻️ Reset</button>

</div>

</div>

<script>

const video = document.getElementById("video");
const videoInput = document.getElementById("videoInput");

const brightness = document.getElementById("brightness");
const contrast = document.getElementById("contrast");
const saturation = document.getElementById("saturation");

let rotation = 0;

videoInput.addEventListener("change", function(){

  const file = this.files[0];

  if(file){
    video.src = URL.createObjectURL(file);
    video.load();
  }

});

function applyFilter(){

  video.style.filter =
  `brightness(${brightness.value}%)
   contrast(${contrast.value}%)
   saturate(${saturation.value}%)`;

}

brightness.addEventListener("input", applyFilter);
contrast.addEventListener("input", applyFilter);
saturation.addEventListener("input", applyFilter);

document.getElementById("speed").addEventListener("input", function(){
  video.playbackRate = this.value;
});

function filterNormal(){

  brightness.value = 100;
  contrast.value = 100;
  saturation.value = 100;

  applyFilter();

}

function filterCinematic(){

  brightness.value = 90;
  contrast.value = 140;
  saturation.value = 120;

  applyFilter();

}

function filterBlack(){

  brightness.value = 100;
  contrast.value = 120;
  saturation.value = 0;

  applyFilter();

}

function filterVivid(){

  brightness.value = 110;
  contrast.value = 130;
  saturation.value = 180;

  applyFilter();

}

function rotateVideo(){

  rotation += 90;

  video.style.transform =
  `rotate(${rotation}deg)`;

}

function resetEdit(){

  brightness.value = 100;
  contrast.value = 100;
  saturation.value = 100;

  document.getElementById("speed").value = 1;

  video.playbackRate = 1;

  rotation = 0;

  video.style.transform = "rotate(0deg)";

  applyFilter();

}

</script>

</body>
</html>>
