<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RKG EDITZ</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}
header{
  padding:18px;
  text-align:center;
  background:#181818;
  font-size:25px;
  font-weight:bold;
}
.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}
.video-box{
  background:#000;
  border-radius:15px;
  overflow:hidden;
  margin-bottom:15px;
  text-align:center;
}
video{
  width:100%;
  max-height:500px;
  display:block;
}
.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}
button,label{
  background:#252525;
  color:white;
  border:1px solid #444;
  border-radius:10px;
  padding:13px;
  text-align:center;
  cursor:pointer;
}
button:hover,label:hover{
  background:#333;
}
input[type=file]{display:none}
.panel{
  background:#181818;
  padding:15px;
  border-radius:15px;
  margin-top:15px;
}
.panel h3{margin-top:0}
input[type=range]{width:100%}
#textInput{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:0;
  margin-bottom:10px;
}
#textLayer{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:30px;
  font-weight:bold;
  text-shadow:2px 2px 5px black;
  pointer-events:none;
}
.preview{
  position:relative;
}
.export{
  width:100%;
  margin-top:15px;
  background:#e91e63;
  border:0;
  font-size:17px;
}
#status{
  text-align:center;
  margin-top:10px;
  color:#aaa;
}
</style>
</head>

<body>

<header>🎬 RKG EDITZ</header>

<div class="container">

<div class="video-box">
  <div class="preview">
    <video id="video" controls></video>
    <div id="textLayer"></div>
  </div>
</div>

<div class="controls">

<label>
  🎥 Add Video
  <input type="file" id="videoInput" accept="video/*">
</label>

<label>
  🎵 Add Song
  <input type="file" id="audioInput" accept="audio/*">
</label>

<button onclick="togglePlay()">▶️ Play / Pause</button>

<button onclick="undoVideo()">↩️ Undo</button>

<button onclick="resetVideo()">🔄 Reset</button>

<button onclick="fullscreenVideo()">⛶ Fullscreen</button>

</div>

<div class="panel">
<h3>⚡ Speed</h3>
<input type="range" id="speed" min="0.25" max="2" step="0.25" value="1">
<p id="speedValue">1x</p>
</div>

<div class="panel">
<h3>🎨 Filters</h3>

<div class="controls">
<button onclick="filter('none')">Normal</button>
<button onclick="filter('grayscale(100%)')">B&W</button>
<button onclick="filter('sepia(100%)')">Sepia</button>
<button onclick="filter('brightness(150%)')">Bright</button>
<button onclick="filter('contrast(180%)')">Contrast</button>
<button onclick="filter('saturate(200%)')">Color</button>
</div>

</div>

<div class="panel">
<h3>📝 Text</h3>

<input id="textInput" type="text" placeholder="ನಿಮ್ಮ text ಇಲ್ಲಿ ಬರೆಯಿರಿ">

<button onclick="addText()">Add Text</button>
<button onclick="clearText()">Clear Text</button>

</div>

<button class="export" onclick="exportVideo()">
💾 EXPORT VIDEO
</button>

<p id="status">ಮೊದಲು video ಆಯ್ಕೆ ಮಾಡಿ.</p>

</div>

<script>

const video = document.getElementById("video");
const videoInput = document.getElementById("videoInput");
const audioInput = document.getElementById("audioInput");
const speed = document.getElementById("speed");
const speedValue = document.getElementById("speedValue");
const textLayer = document.getElementById("textLayer");
const textInput = document.getElementById("textInput");
const status = document.getElementById("status");

let videoURL = null;
let audioURL = null;

videoInput.addEventListener("change", function(){

  const file = this.files[0];

  if(!file) return;

  videoURL = URL.createObjectURL(file);
  video.src = videoURL;

  status.innerText = "✅ Video loaded successfully";

});

audioInput.addEventListener("change", function(){

  const file = this.files[0];

  if(!file) return;

  audioURL = URL.createObjectURL(file);

  status.innerText = "🎵 Song selected successfully";

});

function togglePlay(){

  if(!video.src){
    alert("ಮೊದಲು Video ಆಯ್ಕೆ ಮಾಡಿ.");
    return;
  }

  if(video.paused){
    video.play();
  }else{
    video.pause();
  }
}

speed.addEventListener("input", function(){

  video.playbackRate = this.value;

  speedValue.innerText = this.value + "x";

});

function filter(value){

  video.style.filter = value;

  status.innerText = "🎨 Filter applied";

}

function addText(){

  const text = textInput.value.trim();

  if(text === ""){
    alert("ಮೊದಲು Text ಬರೆಯಿರಿ.");
    return;
  }

  textLayer.innerText = text;

}

function clearText(){

  textLayer.innerText = "";

}

function undoVideo(){

  video.style.filter = "none";
  video.playbackRate = 1;
  speed.value = 1;
  speedValue.innerText = "1x";
  textLayer.innerText = "";

  status.innerText = "↩️ Changes cleared";

}

function resetVideo(){

  video.pause();

  video.currentTime = 0;

  video.style.filter = "none";

  video.playbackRate = 1;

  speed.value = 1;

  speedValue.innerText = "1x";

  textLayer.innerText = "";

  textInput.value = "";

  status.innerText = "🔄 Reset complete";

}

function fullscreenVideo(){

  if(video.requestFullscreen){
    video.requestFullscreen();
  }
}

function exportVideo(){

  if(!video.src){

    alert("ಮೊದಲು Video ಆಯ್ಕೆ ಮಾಡಿ.");

    return;
  }

  alert(
    "⚠️ Browser security ಕಾರಣದಿಂದ ಈ basic version ನಲ್ಲಿ edited video ಅನ್ನು direct MP4 ಆಗಿ export ಮಾಡಲು ಸಾಧ್ಯವಿಲ್ಲ.\n\n" +
    "Full professional export ಬೇಕಾದರೆ FFmpeg/WebCodecs ಅಥವಾ server-side processing ಸೇರಿಸಬೇಕು."
  );

}

</script>

</body>
</html>
