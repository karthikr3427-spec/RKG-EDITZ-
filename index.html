<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RKG EDITZ - Photo, Reels and Creative Editing Studio</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="topbar">
  <div class="brand">
    <span>RKG EDITZ</span>
  </div>

  <nav>
    <a href="#services">SERVICES</a>
    <a href="#quick-tools">QUICK TOOLS</a>
    <a href="#projects">PROJECTS</a>
  </nav>
</header>

<section class="hero-logo">
  <h1>RKG EDITZ</h1>
  <p>Creative Photo, Reels and Video Editing Studio</p>
  <a href="#services" class="service-btn">VIEW SERVICES</a>
</section>

<main>

<section id="services">
  <h2>OUR SERVICES</h2>

  <div class="cards">

    <button class="card" onclick="showMsg('Video Editing')">
      🎬 <b>Video Editing</b>
      <small>Trim, Cut & Creative Editing</small>
    </button>

    <button class="card" onclick="showMsg('Photo Editing')">
      🖼️ <b>Photo Editing</b>
      <small>HD, 4K & 8K Photo Editing</small>
    </button>

    <button class="card" onclick="showMsg('3D Editing')">
      ✨ <b>3D Editing</b>
      <small>3D, HD & Cinematic Effects</small>
    </button>

    <button class="card" onclick="showMsg('Reels Editing')">
      📱 <b>Reels Editing</b>
      <small>Instagram Reels & Shorts</small>
    </button>

    <button class="card" onclick="showMsg('Poster Design')">
      🎨 <b>Poster Design</b>
      <small>Posters, Banners & Designs</small>
    </button>

    <button class="card" onclick="showMsg('Music Editing')">
      🎵 <b>Music Editing</b>
      <small>Add Music & Creative Effects</small>
    </button>

  </div>
</section>

<section id="quick-tools">
  <h2>QUICK TOOLS</h2>
  <div class="chips">
    <span>✂️ Trim</span>
    <span>✂️ Split</span>
    <span>📝 Text</span>
    <span>✨ Effects</span>
    <span>🎵 Music</span>
  </div>
</section>

<section id="projects">
  <h2>MY PROJECTS</h2>
  <div class="project">
    <span>📁</span>
    <div>
      <b>New Project</b>
      <small>Ready to edit</small>
    </div>
  </div>
</section>

</main>

<footer>
  © 2026 RKG EDITZ - Creative Editing Studio
</footer>

<script>
function showMsg(service) {
  alert("RKG EDITZ - " + service + " selected!");
}
</script>

</body>
</html>
