<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RKG EDITZ</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#050505;
  color:white;
}

.app{
  max-width:1100px;
  min-height:100vh;
  margin:auto;
  background:#090909;
  overflow:hidden;
}

/* HEADER */
.header{
  height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px;
  border-bottom:1px solid #252525;
}

.logo{
  font-size:34px;
  font-weight:900;
  font-style:italic;
}

.logo span{
  color:#ffc400;
}

.editz{
  text-align:center;
  color:#ffc400;
  font-size:9px;
  letter-spacing:5px;
}

.header button{
  background:#111;
  color:white;
  border:1px solid #444;
  border-radius:10px;
  padding:10px 13px;
}

.export{
  background:#ffc400!important;
  color:#111!important;
  font-weight:bold;
}

/* EDITOR */
.editor{
  display:grid;
  grid-template-columns:90px 1fr 90px;
  gap:8px;
  padding:8px;
}

.side{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.tool{
  min-height:65px;
  background:#0b0b0b;
  border:1px solid #292929;
  border-radius:12px;
  color:white;
}

.tool:hover{
  border-color:#ffc400;
  color:#ffc400;
}

.tool b{
  display:block;
  font-size:23px;
  margin-bottom:5px;
}

/* PREVIEW */
.preview{
  height:500px;
  background:#000;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

#canvas{
  max-width:100%;
  max-height:100%;
  background:#111;
}

.empty{
  position:absolute;
  text-align:center;
  color:#777;
}

.empty strong{
  color:white;
  font-size:20px;
}

/* TEXT */
.previewText{
  position:absolute;
  top:15%;
  left:50%;
  transform:translateX(-50%);
  font-size:35px;
  font-weight:bold;
  text-shadow:0 3px 10px black;
  display:none;
}

/* TIMELINE */
.timelineArea{
  padding:10px;
}

.time{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  color:#ddd;
}

.controls{
  text-align:center;
  margin:7px;
}

.controls button{
  background:none;
  color:white;
  border:0;
  font-size:25px;
  margin:0 18px;
}

.controls .play{
  font-size:38px;
}

.track{
  height:55px;
  background:#664c12;
  border-radius:8px;
  padding:18px;
}

.musicTrack{
  height:38px;
  margin-top:6px;
  padding:11px;
  border-radius:7px;
  background:#36165e;
}

.textTrack{
  height:38px;
  margin-top:6px;
  padding:11px;
  border-radius:7px;
  background:#715314;
}

.effectTrack{
  height:38px;
  margin-top:6px;
  padding:11px;
  border-radius:7px;
  background:#07543e;
}

#seek{
  width:100%;
  accent-color:#ffc400;
}

/* MAIN TOOLS */
.mainTools{
  display:flex;
  overflow-x:auto;
  border-top:1px solid #292929;
  background:#101216;
}

.mainTools button{
  min-width:105px;
  padding:13px 5px;
  color:white;
  background:none;
  border:0;
}

.mainTools button.active{
  color:#ffc400;
}

.mainTools b{
  display:block;
  font-size:23px;
  margin-bottom:5px;
}

/* BOTTOM */
.bottom{
  display:flex;
  justify-content:space-around;
  border-top:1px solid #292929;
  background:#101216;
}

.bottom button{
  min-width:100px;
  padding:12px 5px;
  color:white;
  background:none;
  border:0;
}

.bottom b{
  display:block;
  font-size:23px;
}

.new{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#ffc400!important;
  color:#111!important;
  font-size:30px!important;
}

/* PANEL */
.panel{
  position:fixed;
  left:50%;
  bottom:15px;
  transform:translateX(-50%);
  width:min(600px,94%);
  background:#18191d;
  border:1px solid #555;
  border-radius:16px;
  padding:18px;
  z-index:20;
  box-shadow:0 10px 50px #000;
}

.panel h3{
  margin-bottom:12px;
}

.panel button,
.panel input{
  padding:10px;
  margin:4px;
  border-radius:8px;
  border:1px solid #555;
  background:#090909;
  color:white;
}

.panel button{
  background:#ffc400;
  color:#111;
  font-weight:bold;
}

.hidden{
  display:none;
}

@media(max-width:650px){

.editor{
  grid-template-columns:60px 1fr 60px;
}

.tool{
  min-height:55px;
}

.tool b{
  font-size:18px;
}

.tool small{
  font-size:9px;
}

.preview{
  height:390px;
}

.mainTools button{
  min-width:75px;
}

.mainTools b{
  font-size:20px;
}

.bottom button{
  min-width:65px;
  font-size:9px;
}

}
</style>
</head>
