<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RKG EDITZ</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
}
header{
  padding:18px;
  text-align:center;
  background:#181818;
  font-size:25px;
  font-weight:bold;
}
.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}
.preview{
  background:#000;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:15px;
}
video{
  width:100%;
  display:block;
  max-height:500px;
}
.controls{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
button,label{
  background:#292929;
  color:white;
  border:0;
  padding:13px;
  border-radius:8px;
  text-align:center;
  cursor:pointer;
  font-size:15px;
}
button:hover,label:hover{
  background:#444;
}
input[type=file]{
  display:none;
}
.panel{
  margin-top:15px;
  padding:15px;
  background:#1b1b1b;
  border-radius:10px;
}
input[type=range]{
  width:100%;
}
select,input[type=text]{
  width:100%;
  padding:10px;
  border-radius:7px;
  border:0;
  margin-top:8px;
}
.export{
  width:100%;
  margin-top:15px;
  background:#e91e63;
  font-size:18px;
}
#status{
  text-align:center;
  margin-top:12px;
  color:#00e676;
}
</style>
</head>

<body>

<header>🎬 RKG EDITZ</header>

<div class="container">

<div class="preview">
<video id="video" controls></video>
</div>

<div class="controls">

<label>
📁 Add Video
<input id="videoInput" type="file" accept="video/*">
</label>

<label>
🎵 Add Song
<input id="audioInput" type="file" accept="audio/*">
</label>

<button id="playBtn">▶️ Play</button>
<button id="pauseBtn">⏸ Pause</button>

<button id="resetBtn">↩️ Reset</button>

</div>

<div class="panel">

<h3>⚡ Speed</h3>

<select id="speed">
<option value="0.5">0.5x</option>
<option value="0.75">0.75x</option>
<option value="1" selected>1x</option>
<option value="1.25">1.25x</option>
<option value="1.5">1.5x</option>
<option value="2">2x</option>
</select>

</div>

<div class="panel">

<h3>🎨 Filter</h3>

<select id="filter">
<option value="none">Normal</option>
<option value="grayscale(100%)">Black & White</option>
<option value="sepia(100%)">Sepia</option>
<option value="brightness(1.4)">Bright</option>
<option value="contrast(1.5)">High Contrast</option>
<option value="saturate(2)">Saturated</option>
</select>

</div>

<div class="panel">

<h3>✂️ Trim</h3>

<label>Start</label>
<input id="start" type="range" min="0" max="100" value="0">

<label>End</label>
<input id="end" type="range" min="0" max="100" value="100">

</div>

<div class="panel">

<h3>📝 Text</h3>
<input id="textInput" type="text" placeholder="Enter text">

<button id="showText" style="margin-top:10px;width:100%">
Add Text
</button>

</div>

<button class="export" id="exportBtn">
💾 Export Video
</button>

<div id="status">No video selected</div>

</div>

<script>

const video = document.getElementById("video");
const videoInput = document.getElementById("videoInput");
const audioInput = document.getElementById("audioInput");

const playBtn = document.getElementById("playBtn");
const pauseBtn = document.getElementById("pauseBtn");
const resetBtn = document.getElementById("resetBtn");

const speed = document.getElementById("speed");
const filter = document.getElementById("filter");

const start = document.getElementById("start");
const end = document.getElementById("end");

const textInput = document.getElementById("textInput");
const showText = document.getElementById("showText");

const exportBtn = document.getElementById("exportBtn");
const status = document.getElementById("status");

let videoURL = null;
let audioURL = null;
let originalVideo = null;

videoInput.addEventListener("change", function(){

  const file = this.files[0];

  if(!file) return;

  if(videoURL){
    URL.revokeObjectURL(videoURL);
  }

  videoURL = URL.createObjectURL(file);
  originalVideo = file;

  video.src = videoURL;

  video.onloadedmetadata = function(){
    start.max = video.duration;
    end.max = video.duration;
    end.value = video.duration;
  };

  status.textContent = "Video loaded successfully ✅";
});

audioInput.addEventListener("change", function(){

  const file = this.files[0];

  if(!file) return;

  if(audioURL){
    URL.revokeObjectURL(audioURL);
  }

  audioURL = URL.createObjectURL(file);

  status.textContent = "Song loaded successfully 🎵";
});

playBtn.onclick = function(){

  if(!video.src){
    alert("First select a video");
    return;
  }

  video.play();
};

pauseBtn.onclick = function(){
  video.pause();
};

resetBtn.onclick = function(){

  video.pause();
  video.currentTime = 0;

  video.playbackRate = 1;
  speed.value = 1;

  video.style.filter = "none";
  filter.value = "none";

  textInput.value = "";

  status.textContent = "Reset completed 🔄";
};

speed.onchange = function(){
  video.playbackRate = Number(this.value);
};

filter.onchange = function(){
  video.style.filter = this.value;
};

start.oninput = function(){

  if(Number(this.value) >= Number(end.value)){
    this.value = Number(end.value) - 0.1;
  }

  video.currentTime = Number(this.value);
};

end.oninput = function(){

  if(Number(this.value) <= Number(start.value)){
    this.value = Number(start.value) + 0.1;
  }
};

video.addEventListener("timeupdate",function(){

  if(video.currentTime >= Number(end.value)){
    video.pause();
  }

});

showText.onclick = function(){

  const text = textInput.value.trim();

  if(!text){
    alert("Enter text first");
    return;
  }

  status.textContent = "Text added: " + text;
};

exportBtn.onclick = function(){

  if(!originalVideo){
    alert("First select a video");
    return;
  }

  /*
    Browser-only export limitation:
    Simple HTML video cannot reliably render every
    filter/text/audio effect into a downloadable MP4
    without a video processing engine such as FFmpeg.
  */

  const link = document.createElement("a");

  link.href = videoURL;
  link.download = "RKG_EDITZ_VIDEO.webm";

  link.click();

  status.textContent =
    "Video exported/downloaded ✅";
};

</script>

</body>
</html>
