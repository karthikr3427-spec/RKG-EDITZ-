<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RKG EDITZ - Video Editor</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#080808;
  color:white;
}

.header{
  height:60px;
  background:#111;
  display:flex;
  align-items:center;
  padding:10px 15px;
  border-bottom:1px solid #292929;
}

.logo{
  width:45px;
  height:45px;
  object-fit:contain;
  margin-right:10px;
}

.header h2{
  font-size:20px;
}

.editor{
  max-width:1100px;
  margin:auto;
}

.preview{
  height:430px;
  background:#050505;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

#video{
  max-width:100%;
  max-height:400px;
  display:none;
}

.upload{
  text-align:center;
}

.upload button{
  background:#ff0050;
  color:white;
  border:0;
  padding:14px 25px;
  border-radius:8px;
  font-size:16px;
}

.tools{
  display:flex;
  overflow-x:auto;
  background:#111;
  padding:12px 5px;
  gap:8px;
}

.tool{
  min-width:75px;
  padding:10px 5px;
  text-align:center;
  background:#1d1d1d;
  border-radius:8px;
  font-size:13px;
}

.tool span{
  display:block;
  font-size:22px;
  margin-bottom:5px;
}

.timeline{
  height:150px;
  background:#0d0d0d;
  border-top:1px solid #222;
  padding:15px;
}

.track{
  height:65px;
  background:#222;
  border-radius:6px;
  margin-top:20px;
  position:relative;
}

.playhead{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:2px;
  background:#ff0050;
}

.controls{
  display:flex;
  justify-content:center;
  gap:15px;
  padding:15px;
  background:#111;
}

.controls button{
  background:#292929;
  color:white;
  border:0;
  padding:10px 18px;
  border-radius:6px;
}

.export{
  background:#ff0050 !important;
}

input[type=file]{
  display:none;
}

.range{
  width:100%;
}
</style>
</head>

<body>

<div class="editor">

<header class="header">

<img src="rkg_editz_logo.png"
     class="logo"
     alt="RKG EDITZ">

<h2>RKG EDITZ</h2>

</header>

<section class="preview">

<div class="upload" id="uploadBox">

<p style="margin-bottom:15px;">
Create amazing videos
</p>

<label for="videoInput">
<button>＋ Add Video</button>
</label>

<input type="file"
       id="videoInput"
       accept="video/*">

</div>

<video id="video"
       controls>
</video>

</section>

<div class="tools">

<div class="tool" onclick="addText()">
<span>📝</span>
Text
</div>

<div class="tool" onclick="showMessage('Effects')">
<span>✨</span>
Effects
</div>

<div class="tool" onclick="showMessage('Filters')">
<span>🎨</span>
Filters
</div>

<div class="tool" onclick="showMessage('Music')">
<span>🎵</span>
Music
</div>

<div class="tool" onclick="showMessage('Speed')">
<span>⚡</span>
Speed
</div>

<div class="tool" onclick="showMessage('Crop')">
<span>✂️</span>
Crop
</div>

<div class="tool" onclick="showMessage('Sticker')">
<span>😀</span>
Sticker
</div>

<div class="tool" onclick="showMessage('Adjust')">
<span>☀️</span>
Adjust
</div>

</div>

<div class="timeline">

<h3>Timeline</h3>

<div class="track">
<div class="playhead"></div>
</div>

</div>

<div class="controls">

<button onclick="videoPlay()">▶ Play</button>

<button onclick="videoPause()">⏸ Pause</button>

<button onclick="video.currentTime=0">
↩ Reset
</button>

<button class="export"
        onclick="exportVideo()">
⬇ Export
</button>

</div>

</div>

<script>

const videoInput =
document.getElementById("videoInput");

const video =
document.getElementById("video");

const uploadBox =
document.getElementById("uploadBox");

videoInput.addEventListener("change",function(){

const file=this.files[0];

if(!file) return;

const url=URL.createObjectURL(file);

video.src=url;

video.style.display="block";

uploadBox.style.display="none";

});

function videoPlay(){
  video.play();
}

function videoPause(){
  video.pause();
}

function addText(){

let text=prompt("Enter text:");

if(text){

alert("Text added: "+text);

}

}

function showMessage(name){

alert(name+" tool ready. Next upgrade will add full functionality.");

}

function exportVideo(){

alert("Export system will be added in the next upgrade.");

}

</script>

</body>
</html>
