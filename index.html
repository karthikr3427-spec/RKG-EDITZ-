<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RKG EDITZ Video Editor</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080808;color:white;font-family:Arial}
.header{
  height:60px;background:#111;display:flex;align-items:center;
  padding:8px 15px;border-bottom:1px solid #333
}
.logo{width:44px;height:44px;object-fit:contain;margin-right:10px}
.header h2{font-size:20px}

.preview{
  height:430px;background:#000;
  display:flex;justify-content:center;align-items:center;
  position:relative;overflow:hidden
}
#video{max-width:100%;max-height:420px}
#textLayer{
  position:absolute;top:45%;left:50%;
  transform:translate(-50%,-50%);
  font-size:32px;font-weight:bold;
  color:white;text-shadow:2px 2px 5px #000;
  pointer-events:none
}

.upload{
  position:absolute;z-index:5;
  text-align:center
}
.upload button,.export{
  background:#ff0050;color:white;border:0;
  padding:13px 22px;border-radius:8px;
  font-size:16px
}
input{display:none}

.tools{
  display:flex;overflow-x:auto;gap:8px;
  background:#111;padding:12px
}
.tool{
  min-width:75px;background:#202020;
  padding:10px 5px;text-align:center;
  border-radius:8px
}
.tool span{display:block;font-size:22px;margin-bottom:5px}

.panel{
  background:#151515;padding:15px;
  display:none
}
.panel input[type=range]{
  display:block;width:100%;margin:12px 0
}
.panel button{
  background:#292929;color:white;
  border:0;padding:9px 13px;
  border-radius:6px;margin:4px
}

.controls{
  display:flex;justify-content:center;
  gap:8px;padding:12px;background:#111
}
.controls button{
  background:#292929;color:white;
  border:0;padding:10px 15px;border-radius:7px
}
</style>
</head>

<body>

<header class="header">
<img src="rkg_editz_logo.png" class="logo">
<h2>RKG EDITZ</h2>
</header>

<div class="preview">

<div class="upload" id="upload">
  <p style="margin-bottom:12px">🎬 Select Your Video</p>
  <label>
    <button>＋ Add Video</button>
    <input type="file" id="videoFile" accept="video/*">
  </label>
</div>

<video id="video" playsinline></video>

<div id="textLayer"></div>

</div>

<div class="tools">

<div class="tool" onclick="openPanel('music')">
<span>🎵</span>Song
</div>

<div class="tool" onclick="openPanel('effect')">
<span>✨</span>Effects
</div>

<div class="tool" onclick="openPanel('text')">
<span>📝</span>Text
</div>

<div class="tool" onclick="openPanel('speed')">
<span>⚡</span>Speed
</div>

<div class="tool" onclick="openPanel('filter')">
<span>🎨</span>Filter
</div>

</div>

<!-- MUSIC -->

<div class="panel" id="music">
<h3>🎵 Add Song</h3>

<label>
<button>Choose Song</button>
<input type="file" id="audioFile" accept="audio/*">
</label>

<p id="songName" style="margin-top:10px"></p>
</div>

<!-- EFFECTS -->

<div class="panel" id="effect">
<h3>✨ Effects</h3>

<button onclick="effect('none')">Normal</button>
<button onclick="effect('gray')">B&W</button>
<button onclick="effect('bright')">Bright</button>
<button onclick="effect('contrast')">Contrast</button>
<button onclick="effect('vintage')">Vintage</button>
<button onclick="effect('blur')">Blur</button>
</div>

<!-- TEXT -->

<div class="panel" id="text">
<h3>📝 Add Text</h3>

<input
 id="textInput"
 type="text"
 placeholder="Enter text"
 style="display:block;width:100%;padding:10px"
>

<button onclick="addText()">Add Text</button>
<button onclick="removeText()">Remove</button>
</div>

<!-- SPEED -->

<div class="panel" id="speed">
<h3>⚡ Video Speed</h3>

<button onclick="speed(0.5)">0.5x</button>
<button onclick="speed(1)">1x</button>
<button onclick="speed(1.5)">1.5x</button>
<button onclick="speed(2)">2x</button>
</div>

<!-- FILTER -->

<div class="panel" id="filter">
<h3>🎨 Filters</h3>

<button onclick="effect('none')">Original</button>
<button onclick="effect('warm')">Warm</button>
<button onclick="effect('cool')">Cool</button>
<button onclick="effect('dark')">Dark</button>
</div>

<div class="controls">

<button onclick="playVideo()">▶️</button>
<button onclick="pauseVideo()">⏸️</button>
<button onclick="video.currentTime=0">↩️</button>

<button class="export" onclick="exportVideo()">
💾 Export
</button>

</div>

<audio id="musicAudio"></audio>

<script>

const video = document.getElementById("video");
const upload = document.getElementById("upload");
const textLayer = document.getElementById("textLayer");
const musicAudio = document.getElementById("musicAudio");

let currentEffect = "none";

/* VIDEO */

document.getElementById("videoFile").onchange=function(){

const file=this.files[0];

if(!file)return;

video.src=URL.createObjectURL(file);

video.style.display="block";

upload.style.display="none";

video.load();

};

/* SONG */

document.getElementById("audioFile").onchange=function(){

const file=this.files[0];

if(!file)return;

musicAudio.src=URL.createObjectURL(file);

document.getElementById("songName").innerText =
"🎵 "+file.name;

};

/* PLAY */

function playVideo(){

video.play();

if(musicAudio.src){
musicAudio.currentTime=video.currentTime;
musicAudio.play();
}

}

/* PAUSE */

function pauseVideo(){

video.pause();
musicAudio.pause();

}

/* SPEED */

function speed(value){

video.playbackRate=value;

}

/* TEXT */

function addText(){

const text=document.getElementById("textInput").value;

textLayer.innerText=text;

}

function removeText(){

textLayer.innerText="";

}

/* EFFECTS */

function effect(type){

currentEffect=type;

if(type=="none")
video.style.filter="none";

if(type=="gray")
video.style.filter="grayscale(100%)";

if(type=="bright")
video.style.filter="brightness(1.4)";

if(type=="contrast")
video.style.filter="contrast(1.6)";

if(type=="vintage")
video.style.filter="sepia(70%) contrast(1.2)";

if(type=="blur")
video.style.filter="blur(3px)";

if(type=="warm")
video.style.filter="sepia(40%) saturate(1.5)";

if(type=="cool")
video.style.filter="hue-rotate(180deg)";

if(type=="dark")
video.style.filter="brightness(.55)";

}

/* PANELS */

function openPanel(id){

document.querySelectorAll(".panel")
.forEach(p=>p.style.display="none");

document.getElementById(id).style.display="block";

}

/* EXPORT */

async function exportVideo(){

if(!video.src){

alert("ಮೊದಲು Video select ಮಾಡಿ");

return;

}

alert(
"Preview editing ready! 🎬\n\n"+
"Video + Effects + Text preview ಆಗುತ್ತದೆ.\n"+
"Advanced MP4 exportಗಾಗಿ next version ನಲ್ಲಿ FFmpeg ಸೇರಿಸಬಹುದು."
);

}

</script>

</body>
</html>
