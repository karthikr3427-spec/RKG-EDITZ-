<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>RKG EDITZ - Video Editor</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Serif+Kannada:wght@400;600;700&family=Poppins:wght@400;500;600;700;800&family=Roboto:wght@400;500;700;900&family=Oswald:wght@400;500;700&family=Lobster&family=Pacifico&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:#070707;
    color:#fff;
    font-family:Poppins,Arial,sans-serif;
}

body{
    min-height:100vh;
}

header{
    padding:18px 12px;
    text-align:center;
    background:linear-gradient(135deg,#ff0066,#7200ff);
    box-shadow:0 5px 25px #000;
}

.logo{
    font-size:30px;
    font-weight:900;
    letter-spacing:2px;
    text-shadow:0 0 15px #fff;
}

.subtitle{
    font-size:11px;
    opacity:.9;
    margin-top:3px;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:14px;
}

.card{
    background:#151515;
    border:1px solid #292929;
    border-radius:18px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 8px 30px #0008;
}

h2{
    margin:2px 0 14px;
    font-size:18px;
}

input[type=file],
input[type=text],
select{
    width:100%;
    padding:12px;
    margin:5px 0;
    border:1px solid #444;
    border-radius:10px;
    background:#0d0d0d;
    color:#fff;
    outline:none;
}

input[type=range]{
    width:100%;
    accent-color:#ff0066;
}

button{
    border:0;
    border-radius:10px;
    padding:11px 14px;
    margin:4px;
    background:#292929;
    color:#fff;
    cursor:pointer;
    font-weight:600;
    transition:.15s;
}

button:hover{
    background:#ff0066;
}

button:active{
    transform:scale(.96);
}

.primary{
    background:linear-gradient(135deg,#ff0066,#7200ff);
}

.danger{
    background:#9d183d;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:7px;
}

.preview{
    width:100%;
    min-height:250px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#030303;
    border-radius:14px;
    overflow:hidden;
}

#canvas{
    display:block;
    width:100%;
    height:auto;
    max-height:600px;
    background:#111;
}

#sourceVideo{
    display:none;
}

audio{
    width:100%;
    margin-top:8px;
}

.status{
    margin-top:10px;
    padding:10px;
    border-radius:10px;
    background:#0c0c0c;
    color:#79ffae;
    font-size:13px;
    word-break:break-word;
}

.progress{
    width:100%;
    height:13px;
    margin-top:10px;
    background:#292929;
    border-radius:20px;
    overflow:hidden;
}

#progressBar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ff0066,#7200ff);
    transition:width .15s;
}

.small{
    color:#999;
    font-size:12px;
    line-height:1.5;
}

.label{
    display:block;
    margin-top:10px;
    margin-bottom:4px;
    font-size:13px;
}

.downloadBox{
    display:none;
    margin-top:12px;
    padding:12px;
    border-radius:12px;
    background:#101010;
}

#downloadLink{
    display:inline-block;
    text-decoration:none;
    color:#fff;
    background:linear-gradient(135deg,#00a86b,#0066ff);
    padding:12px 18px;
    border-radius:10px;
    font-weight:700;
}

hr{
    border:0;
    border-top:1px solid #292929;
    margin:15px 0;
}

@media(max-width:600px){
    .container{
        padding:10px;
    }

    .card{
        padding:12px;
        border-radius:15px;
    }

    .logo{
        font-size:26px;
    }

    button{
        padding:10px 11px;
        font-size:13px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">RKG EDITZ</div>
    <div class="subtitle">VIDEO • MUSIC • EFFECTS • MP4</div>
</header>

<div class="container">

    <!-- VIDEO -->
    <div class="card">
        <h2>🎬 Video Upload</h2>

        <input
            id="videoInput"
            type="file"
            accept="video/*"
        >

        <div id="videoStatus" class="status">
            First video upload madi.
        </div>
    </div>

    <!-- MUSIC -->
    <div class="card">
        <h2>🎵 Music</h2>

        <input
            id="musicInput"
            type="file"
            accept="audio/*"
        >

        <audio id="music" controls></audio>

        <label class="label">Music Volume</label>

        <input
            id="musicVolume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
        >

        <div class="small">
            Export madidaga selected music MP4-ge add agutte.
        </div>
    </div>

    <!-- PREVIEW -->
    <div class="card">
        <h2>👀 Preview</h2>

        <div class="preview">
            <canvas id="canvas" width="1280" height="720"></canvas>
        </div>

        <div class="small" style="margin-top:8px;">
            Preview automatically update agutte.
        </div>
    </div>

    <!-- EFFECTS -->
    <div class="card">
        <h2>🎨 10 Effects</h2>

        <div class="grid">
            <button onclick="setEffect('normal')">Normal</button>
            <button onclick="setEffect('grayscale')">Grayscale</button>
            <button onclick="setEffect('sepia')">Sepia</button>
            <button onclick="setEffect('invert')">Invert</button>
            <button onclick="setEffect('blur')">Blur</button>
            <button onclick="setEffect('brightness')">Brightness</button>
            <button onclick="setEffect('contrast')">Contrast</button>
            <button onclick="setEffect('saturate')">Saturation</button>
            <button onclick="setEffect('vintage')">Vintage</button>
            <button onclick="setEffect('glow')">Glow</button>
        </div>

        <label class="label">Effect Amount</label>

        <input
            id="effectAmount"
            type="range"
            min="0"
            max="200"
            value="100"
        >
    </div>

    <!-- FONT -->
    <div class="card">
        <h2>🔤 Fonts</h2>

        <select id="fontSelect">

            <option value="Poppins">Poppins</option>
            <option value="Roboto">Roboto</option>
            <option value="Oswald">Oswald</option>
            <option value="Lobster">Lobster</option>
            <option value="Pacifico">Pacifico</option>
            <option value="Playfair Display">Playfair Display</option>

            <option value="Noto Sans Kannada">
                Noto Sans Kannada
            </option>

            <option value="Noto Serif Kannada">
                Noto Serif Kannada
            </option>

            <option value="Baloo Tamma 2">
                Baloo Tamma 2
            </option>

        </select>
    </div>

    <!-- TEXT -->
    <div class="card">
        <h2>✍️ Text + Kannada</h2>

        <input
            id="textInput"
            type="text"
            placeholder="ನಿಮ್ಮ Text ಇಲ್ಲಿ ಬರೆಯಿರಿ"
        >

        <label class="label">Text Size</label>

        <input
            id="textSize"
            type="range"
            min="20"
            max="150"
            value="60"
        >

        <div class="grid">
            <button onclick="setTextStyle('normal')">Normal</button>
            <button onclick="setTextStyle('shadow')">Shadow</button>
            <button onclick="setTextStyle('outline')">Outline</button>
            <button onclick="setTextStyle('glow')">Glow</button>
            <button onclick="setTextStyle('3d')">3D</button>
            <button onclick="setTextStyle('gradient')">Gradient</button>
        </div>
    </div>

    <!-- EXPORT -->
    <div class="card">

        <h2>🚀 Export MP4</h2>

        <button
            id="exportBtn"
            class="primary"
            onclick="exportMP4()"
        >
            📥 EXPORT MP4
        </button>

        <button
            class="danger"
            onclick="stopExport()"
        >
            ⛔ STOP
        </button>

        <div class="progress">
            <div id="progressBar"></div>
        </div>

        <div id="exportStatus" class="status">
            Ready.
        </div>

        <div id="downloadBox" class="downloadBox">
            <a id="downloadLink" href="#" download="RKG-EDITZ.mp4">
                📥 Download RKG-EDITZ.mp4
            </a>
        </div>

    </div>

    <!-- RESET -->
    <div class="card">
        <button onclick="resetEditor()">
            ♻️ RESET EVERYTHING
        </button>
    </div>

</div>

<script type="module" src="./script.js"></script>

</body>
</html>
